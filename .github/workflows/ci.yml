name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose build backend

      - name: Start services
        run: docker compose up -d

      - name: Wait for service to be ready
        run: |
          echo "Waiting for service to be healthy..."
          timeout 60 bash -c 'until curl -s http://localhost:8003/health > /dev/null; do sleep 2; done'
          echo "Service is ready!"

      - name: Run tests
        run: docker compose exec -T backend pytest -v tests/

      - name: Run linter
        run: docker compose exec -T backend ruff check app/

      - name: Run formatter check
        run: docker compose exec -T backend black --check app/

      - name: Stop services
        if: always()
        run: docker compose down

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: pip install ruff black

      - name: Run ruff
        run: ruff check backend/app/

      - name: Run black
        run: black --check backend/app/
