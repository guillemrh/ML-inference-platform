apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: jaeger
          matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          urlDisplayLabel: View in Jaeger

  - name: Jaeger
    type: jaeger
    access: proxy
    uid: jaeger
    url: http://jaeger:16686
    isDefault: false
    editable: false
