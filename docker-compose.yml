version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml-inference-backend
    ports:
      - "8003:8000" 
    environment:
      - APP_NAME=ml-inference-platform
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - MODEL_PATH=/app/models/reactor_model_v1.pkl
      - MODEL_VERSION=v1
    volumes:
      # Mount code for development (hot reload)
      - ./backend/app:/app/app
      # Mount tests for development
      - ./backend/tests:/app/tests
      # Mount models directory
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  default:
    name: ml-inference-network