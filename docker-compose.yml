version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml-inference-backend
    ports:
      - "8003:8000" 
    environment:
      - APP_NAME=ml-inference-platform
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Primary model
      - MODEL_PATH=/app/models/reactor_model_v1.pkl
      - MODEL_VERSION=v1
      # Shadow mode (set SHADOW_ENABLED=true to enable)
      - SHADOW_ENABLED=true
      - SHADOW_MODEL_PATH=/app/models/reactor_model_v2.pkl
      - SHADOW_MODEL_VERSION=v2
      - SHADOW_TIMEOUT_MS=500
    volumes:
      # Mount code for development (hot reload)
      - ./backend/app:/app/app
      # Mount tests for development
      - ./backend/tests:/app/tests
      # Mount models directory
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ml-inference-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ml-inference-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: ml-inference-network