version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml-inference-backend
    ports:
      - "8003:8000" 
    environment:
      - APP_NAME=ml-inference-platform
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # Primary model
      - MODEL_PATH=/app/models/reactor_model_v1.pkl
      - MODEL_VERSION=v1
      # Deployment mode: "direct", "shadow", or "canary"
      - DEPLOYMENT_MODE=canary
      # Secondary model (used as shadow or canary)
      - SECONDARY_MODEL_PATH=/app/models/reactor_model_v2.pkl
      - SECONDARY_MODEL_VERSION=v2
      - SHADOW_TIMEOUT_MS=500
      # Canary settings
      - CANARY_WEIGHT=10
      # Tracing
      - TRACING_ENABLED=true
      - OTLP_ENDPOINT=http://jaeger:4317
      - TRACE_SAMPLE_RATE=1.0
      # Registry
      - REGISTRY_ENABLED=false
      - REGISTRY_URL=http://registry:8001
      - MODEL_NAME=reactor_model
    volumes:
      # Mount code for development (hot reload)
      - ./backend/app:/app/app
      # Mount tests for development
      - ./backend/tests:/app/tests
      # Mount models directory
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ml-inference-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped
    depends_on:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: ml-inference-jaeger
    ports:
      - "16687:16686"  # Jaeger UI
      - "4318:4317"    # OTLP gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.0
    container_name: ml-inference-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:2.9.3
    container_name: ml-inference-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  promtail:
    image: grafana/promtail:2.9.3
    container_name: ml-inference-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  postgres:
    image: postgres:16-alpine
    container_name: ml-inference-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=registry
      - POSTGRES_PASSWORD=registry_password
      - POSTGRES_DB=model_registry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d model_registry"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  registry:
    build:
      context: ./registry
      dockerfile: Dockerfile
    container_name: ml-model-registry
    ports:
      - "8001:8001"
    environment:
      - APP_NAME=ml-model-registry
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://registry:registry_password@postgres:5432/model_registry
    volumes:
      - ./registry/app:/app/app
      - ./registry/tests:/app/tests
      - ./models:/app/models
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  loki_data:

networks:
  default:
    name: ml-inference-network